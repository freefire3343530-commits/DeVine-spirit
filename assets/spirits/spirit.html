<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Spirit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;800&family=Hanken+Grotesk:wght@500;700&display=swap">
<style>
:root{--bg1:#0B3B22;--bg2:#06241A;--ac:#9BE15D;--ac2:#D6F5A8;--gold:#E6B94F;--panel:rgba(5,22,14,.82);--panel2:rgba(255,255,255,.07);--line:rgba(230,185,79,.6);--txt:#F2FFE8;--mut:#A8CDB0;--bar:#6BE23A;--disp:'Cinzel',Georgia,serif;--body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',sans-serif;--glow:rgba(155,225,93,.55)}
body.t-fire{--bg1:#3A0A06;--bg2:#120404;--ac:#FF8A2A;--ac2:#FFD79A;--panel:rgba(30,6,4,.84);--txt:#FFF1E4;--mut:#E0AE92;--bar:#FF9A2E;--glow:rgba(255,120,40,.55)}
body.t-moon{--bg1:#241766;--bg2:#0B0722;--ac:#C3B2FF;--ac2:#EDE8FF;--panel:rgba(14,8,44,.84);--txt:#F1EDFF;--mut:#B6AAE6;--bar:#B69CFF;--glow:rgba(170,150,255,.55)}
body.t-sun{--bg1:#B8571A;--bg2:#3D1A22;--ac:#FFC73D;--ac2:#FFE9A8;--panel:rgba(52,22,8,.86);--txt:#FFF6E0;--mut:#EBC79A;--bar:#FFB92E;--glow:rgba(255,190,60,.6)}
body.t-star{--bg1:#2C1A78;--bg2:#0B0722;--ac:#F5C451;--ac2:#FFE9A8;--panel:rgba(14,8,44,.84);--txt:#F4EEFF;--mut:#BDB0EA;--bar:#FFC94A;--glow:rgba(255,205,80,.55)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{color:var(--txt);font-family:var(--body);font-size:15px;line-height:1.35;background:linear-gradient(180deg,var(--bg1),var(--bg2) 70%);overflow-x:hidden;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(18px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left))}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
svg{display:block}
.pg{position:relative;z-index:1;max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:10px}

/* ambient particles (few, transform/opacity only) */
#fx{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;contain:strict}
#fx i{position:absolute;left:var(--x);top:-6%;width:var(--s);height:var(--s);opacity:0;will-change:transform,opacity;animation:fall var(--d) linear var(--dl) infinite}
body.t-leaf #fx i{border-radius:0 100% 0 100%;background:linear-gradient(135deg,#B6F56B,#3FAE2A)}
body.t-fire #fx i{top:auto;bottom:-6%;border-radius:50%;background:radial-gradient(circle,#FFE27A,#FF6A1A 70%);animation-name:rise}
body.t-moon #fx i,body.t-star #fx i{border-radius:50%;background:radial-gradient(circle,#fff,rgba(255,255,255,0) 70%);animation-name:twk;top:var(--y)}
body.t-sun #fx i{border-radius:50%;background:radial-gradient(circle,#FFF3B0,rgba(255,200,60,0) 70%);animation-name:twk;top:var(--y)}
@keyframes fall{0%{transform:translate3d(0,0,0) rotate(0);opacity:0}10%{opacity:.85}100%{transform:translate3d(-40px,115vh,0) rotate(300deg);opacity:0}}
@keyframes rise{0%{transform:translate3d(0,0,0);opacity:0}15%{opacity:.9}100%{transform:translate3d(24px,-115vh,0);opacity:0}}
@keyframes twk{0%,100%{transform:scale(.5);opacity:.15}50%{transform:scale(1);opacity:.95}}
.paused #fx i,.paused .idle{animation-play-state:paused}

/* header */
.hd{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:8px}
.back{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--panel);display:grid;place-items:center;color:var(--ac2)}
.back svg{width:22px;height:22px}
.ttl{text-align:center;min-width:0}
.ttl h1{margin:0;font-family:var(--disp);font-weight:800;font-size:clamp(20px,6.6vw,27px);line-height:1.1;color:var(--ac2);text-shadow:0 2px 0 rgba(0,0,0,.45),0 0 14px var(--glow);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ttl p{margin:2px 0 0;font-size:12px;color:var(--mut);font-style:italic}
.act-badge{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 9px;border-radius:14px;border:1.5px solid var(--line);background:var(--panel);font-size:10px;font-weight:800;line-height:1.05;letter-spacing:.03em;color:var(--ac2);text-align:left}
.act-badge b{width:24px;height:24px;border-radius:50%;background:#3FBF1F;display:grid;place-items:center;color:#fff}
.act-badge svg{width:14px;height:14px}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 8px 9px;border-radius:16px;border:1.5px solid var(--line);background:var(--panel)}
.st{min-width:0}
.st .r{display:flex;align-items:center;gap:4px}
.st svg{width:18px;height:18px;flex:0 0 auto;color:var(--ac)}
.st .l{font-size:10.5px;color:var(--mut);line-height:1;white-space:nowrap}
.st .v{font-size:13.5px;font-weight:800;line-height:1.05}
.st .bar{height:7px;border-radius:9px;background:rgba(0,0,0,.45);margin-top:5px;overflow:hidden;border:1px solid rgba(255,255,255,.1)}
.st .bar i{display:block;height:100%;width:100%;transform-origin:0 50%;transform:scaleX(.5);background:var(--bar);border-radius:9px;transition:transform .35s ease}
.st .bar i.warn{background:#F2B730}.st .bar i.bad{background:#F0503C}

/* stage */
.stage{position:relative;border-radius:22px;overflow:hidden;border:2px solid var(--line);background:var(--bg2);aspect-ratio:840/1075;box-shadow:0 0 0 1px rgba(0,0,0,.5),0 10px 24px -12px #000;contain:layout paint;user-select:none;-webkit-user-select:none}
.stage .art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 100%;transform-origin:50% 100%;pointer-events:none}
.idle{animation:idle 5s ease-in-out infinite;will-change:transform}
@keyframes idle{0%,100%{transform:scale(1.035)}50%{transform:scale(1.06)}}
.stage .art.a-hop{animation:hop .5s ease-out}
.stage .art.a-giggle{animation:giggle .6s ease-in-out}
.stage .art.a-wiggle{animation:wiggle .5s ease-in-out}
.stage .art.a-shiver{animation:shiver .09s linear infinite}
.stage .art.a-chew{animation:chew .32s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0) scale(1.035)}35%{transform:translateY(-12px) scale(1.05)}65%{transform:translateY(0) scale(1.03,1.02)}}
@keyframes giggle{0%,100%{transform:rotate(0) scale(1.04)}25%{transform:rotate(-1.2deg) scale(1.04)}75%{transform:rotate(1.2deg) scale(1.04)}}
@keyframes wiggle{0%,100%{transform:rotate(0) scale(1.04)}25%{transform:rotate(-2deg) scale(1.04)}60%{transform:rotate(2deg) scale(1.04)}}
@keyframes shiver{0%,100%{transform:translateX(-3px) scale(1.04)}50%{transform:translateX(3px) scale(1.04)}}
@keyframes chew{0%,100%{transform:scale(1.04)}50%{transform:scale(1.06,1.03)}}
.hit{position:absolute;left:14%;right:14%;top:9%;bottom:12%;z-index:2;border-radius:40%;touch-action:manipulation}
.bubble{position:absolute;z-index:4;right:4%;top:5%;max-width:54%;padding:9px 13px;border-radius:18px;border:1.5px solid var(--line);background:var(--panel);color:var(--ac2);font-family:var(--disp);font-weight:700;font-size:clamp(12px,3.7vw,15px);line-height:1.25;text-align:center;opacity:0;transform:translateY(-6px) scale(.96);transition:opacity .25s,transform .25s;pointer-events:none}
.bubble.on{opacity:1;transform:none}
.toast{position:absolute;z-index:6;left:50%;bottom:34px;transform:translate(-50%,6px);max-width:calc(100% - 20px);width:max-content;padding:8px 14px;border-radius:99px;background:var(--panel);border:1.5px solid var(--line);font-size:12.5px;font-weight:700;color:var(--ac2);text-align:center;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
.layer{position:absolute;inset:0;pointer-events:none;z-index:5}
.fl{position:absolute;font-family:var(--disp);font-weight:800;font-size:22px;color:#FFE27A;text-shadow:0 2px 0 #7a4c00,0 0 8px rgba(0,0,0,.6);animation:fup 1.1s ease-out forwards;will-change:transform,opacity}
.fl svg{width:26px;height:26px}
@keyframes fup{0%{transform:translate(-50%,0) scale(.7);opacity:0}15%{opacity:1;transform:translate(-50%,-8px) scale(1)}100%{transform:translate(-50%,-64px) scale(1);opacity:0}}
.drop{position:absolute;z-index:7;top:0;width:54px;height:54px;margin-left:-27px;pointer-events:auto;touch-action:manipulation;animation:dfall 11s linear forwards;will-change:transform,opacity}
.drop svg{width:100%;height:100%}
@keyframes dfall{0%{transform:translate3d(0,-60px,0);opacity:1}45%{transform:translate3d(0,var(--fy),0);opacity:1}88%{transform:translate3d(0,var(--fy),0);opacity:1}100%{transform:translate3d(0,var(--fy),0);opacity:0}}
.foam{position:absolute;z-index:6;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#E8F7FF 60%,#B8E4FA);border:1.5px solid #8CCBEA;transition:transform .22s,opacity .22s;pointer-events:none}
.foam.pop{transform:scale(1.7);opacity:0}
.shower{position:absolute;z-index:6;left:20%;right:20%;top:0;height:0;overflow:hidden;opacity:0;transition:opacity .3s,height .5s;pointer-events:none}
.shower.on{opacity:1;height:70%}
.shower i{position:absolute;top:-20px;width:4px;height:22px;border-radius:3px;background:#8FDCFF;opacity:.9;animation:sh .55s linear infinite;left:var(--x);animation-delay:var(--dl)}
@keyframes sh{to{transform:translateY(420px)}}
.can{position:absolute;z-index:6;right:6%;top:28%;width:90px;opacity:0;transform:translate(40px,-20px) rotate(0);transition:transform .6s cubic-bezier(.3,1.15,.5,1),opacity .4s;pointer-events:none}
.can.on{opacity:1;transform:translate(0,0) rotate(-24deg)}
.can .pour{position:absolute;left:-6px;top:44px;width:4px;height:0;background:linear-gradient(#9FE0FF,rgba(159,224,255,0));border-radius:3px;transition:height .25s}
.can.pouring .pour{height:120px}
.fly{position:absolute;z-index:8;left:0;top:0;width:54px;height:54px;pointer-events:none;will-change:transform}
.fly svg{width:100%;height:100%}

/* actions */
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:-26px;position:relative;z-index:6;padding:0 6px}
.ab{height:54px;border-radius:99px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;gap:7px;font-family:var(--disp);font-weight:800;font-size:clamp(14px,4.4vw,17px);color:#fff;text-shadow:0 1px 2px #000;box-shadow:0 6px 14px -6px #000,inset 0 1px 0 rgba(255,255,255,.3);transition:transform .12s}
.ab:active:not(:disabled){transform:scale(.95)}
.ab svg{width:24px;height:24px}
.ab.f{background:linear-gradient(180deg,#3B6A2E,#143A12)}
.ab.w{background:linear-gradient(180deg,#3FA6E8,#1556A6)}
.ab.b{background:linear-gradient(180deg,#8A4FE0,#4B1FA0)}
.ab:disabled{opacity:.55;cursor:default}
.ab .c{font-family:var(--body);font-size:10px;font-weight:700;opacity:.85;display:block;line-height:1}
.ab .tx{display:flex;flex-direction:column;align-items:flex-start;line-height:1.05}

/* shelf */
.shelf{padding:10px 8px 10px;border-radius:18px;border:1.5px solid var(--line);background:var(--panel)}
.shh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;padding:0 4px}
.shh h2{margin:0;font-family:var(--disp);font-weight:800;font-size:16px;color:var(--ac2);letter-spacing:.02em}
.pts{display:flex;align-items:center;gap:6px;padding:3px 10px 3px 4px;border-radius:99px;background:rgba(0,0,0,.4);border:1px solid var(--line);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.pts svg{width:20px;height:20px}
.pts.bump{animation:bump .3s ease}.pts.nope{animation:nope .3s ease}
@keyframes bump{40%{transform:scale(1.12)}}
@keyframes nope{20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
.foods{display:grid;grid-template-columns:repeat(var(--n,4),minmax(0,1fr));gap:7px}
.food{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 3px 7px;min-height:98px;border-radius:14px;border:1.5px solid rgba(255,255,255,.14);background:var(--panel2);text-align:center;transition:transform .12s}
.food:active:not(:disabled){transform:scale(.95)}
.food svg{width:40px;height:40px}
.food .nm{font-size:11.5px;font-weight:700;line-height:1.1;min-height:25px;display:flex;align-items:center;justify-content:center}
.food .pr{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:800;color:#FFE27A}
.food .pr svg{width:14px;height:14px}
.food.poor{opacity:.5}
.food:disabled{cursor:default}
.shelf.hl{animation:hl .9s ease}
@keyframes hl{50%{box-shadow:0 0 0 3px var(--ac),0 0 18px var(--glow)}}

/* happiness */
.hap{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:9px 10px;border-radius:18px;border:1.5px solid var(--line);background:var(--panel)}
.hap .hr{width:40px;height:40px;color:#FF6FA0}
.hap .mid{min-width:0}
.hap .t{display:flex;justify-content:space-between;gap:6px;font-size:12px;font-weight:700;color:var(--ac2)}
.hap .t em{font-style:normal;color:var(--mut);font-weight:600}
.hap .bar{height:10px;border-radius:9px;background:rgba(0,0,0,.45);margin-top:6px;overflow:hidden;border:1px solid rgba(255,255,255,.12)}
.hap .bar i{display:block;height:100%;transform-origin:0 50%;transform:scaleX(.5);background:linear-gradient(90deg,#FF5C98,#FF9BC4);border-radius:9px;transition:transform .35s ease}
.hap .s{margin-top:5px;font-size:11px;color:var(--mut)}
.chest{display:flex;flex-direction:column;align-items:center;justify-content:center;width:64px;padding:6px 4px;border-radius:14px;border:1.5px solid var(--line);background:linear-gradient(180deg,rgba(255,215,90,.25),rgba(255,160,40,.1));font-weight:800;color:#FFE27A;line-height:1.1;text-align:center}
.chest b{font-family:var(--disp);font-size:15px}
.chest small{font-size:9.5px;color:var(--ac2);font-weight:700}
@media (prefers-reduced-motion:reduce){#fx{display:none}.idle,.stage .art{animation:none!important}.fl,.drop{animation-duration:.01s}}
@media (max-width:340px){.act-badge{display:none}.hd{grid-template-columns:44px 1fr}.food svg{width:34px;height:34px}.stats{gap:4px}}
</style>
</head>
<body class="t-leaf">
<div id="fx" aria-hidden="true"></div>
<main class="pg">
  <header class="hd">
    <button class="back" id="back" type="button" aria-label="Back to collection"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="ttl"><h1 id="ttl">Spirit</h1><p id="sub"></p></div>
    <div class="act-badge" aria-label="Active spirit"><span>ACTIVE<br>SPIRIT</span><b><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></b></div>
  </header>

  <section class="stats" id="stats" aria-label="Spirit stats"></section>

  <section class="stage" id="stage">
    <img class="art idle" id="art" alt="" width="840" height="1075" decoding="async" fetchpriority="high">
    <div class="bubble" id="bubble" role="status"></div>
    <button class="hit" id="hit" type="button" aria-label="Pet the spirit"></button>
    <div class="layer" id="lay"></div>
    <div class="shower" id="shower"></div>
    <div class="can" id="can"><svg viewBox="-34 -26 68 52" width="90"><g stroke="#2f6f8a" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M-14 -6H10L12 14Q12 18 8 18H-10Q-14 18 -14 14Z" fill="#6bc4e8"/><path d="M-14 0L-26 -12" fill="none" stroke-width="3"/><path d="M-30 -16L-22 -8L-24 -4L-32 -12Z" fill="#8fd4f0"/><path d="M10 -2Q22 -4 20 8Q18 14 11 12" fill="none" stroke-width="3"/></g></svg><i class="pour"></i></div>
    <div class="toast" id="toast"></div>
  </section>

  <div class="acts">
    <button class="ab f" id="bFeed" type="button"><svg viewBox="-24 -24 48 48" id="icF"></svg><span>Feed</span></button>
    <button class="ab w" id="bWater" type="button"><svg viewBox="0 0 24 24"><path d="M12 2.5S5 10.5 5 15a7 7 0 0014 0c0-4.5-7-12.5-7-12.5z" fill="#BDEBFF" stroke="#2f6f8a" stroke-width="1.6"/><path d="M9 15a3 3 0 003 3" stroke="#fff" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg><span class="tx">Water<span class="c">Free</span></span></button>
    <button class="ab b" id="bBath" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h18v2a5 5 0 01-5 5H8a5 5 0 01-5-5v-2zM6 12V6a2 2 0 013.5-1.3M7 19l-1 2M17 19l1 2"/><circle cx="13" cy="7" r="1.1" fill="#fff"/><circle cx="16" cy="9" r="1.1" fill="#fff"/></svg><span class="tx">Bathe<span class="c">15 pts</span></span></button>
  </div>

  <section class="shelf" id="shelf" aria-labelledby="shh">
    <div class="shh"><h2 id="shh">Snack Shelf</h2><div class="pts" id="ptsBox"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#F5C451" stroke="#B27A12" stroke-width="1.6"/><circle cx="12" cy="12" r="6.2" fill="none" stroke="#B27A12" stroke-width="1.2"/><path d="M12 8.5v7M9.8 10.6c0-1.2 4.4-1.2 4.4 0s-4.4 1-4.4 2.4 4.4 1.2 4.4 0" fill="none" stroke="#8A5A0C" stroke-width="1.2" stroke-linecap="round"/></svg><b id="pts">40</b></div></div>
    <div class="foods" id="foods"></div>
  </section>

  <section class="hap" aria-label="Happiness and bonus">
    <svg class="hr" viewBox="0 0 24 24"><path d="M12 21C5 15 2 11 2 7.5A5 5 0 0112 6a5 5 0 0110 1.5C22 11 19 15 12 21z" fill="currentColor" stroke="#fff" stroke-opacity=".6" stroke-width="1.2"/></svg>
    <div class="mid">
      <div class="t"><span>Happiness &amp; Bonus</span><em id="hapN">70%</em></div>
      <div class="bar" role="meter" aria-label="Happiness" aria-valuemin="0" aria-valuemax="100" id="hapBar"><i id="hapFill"></i></div>
      <div class="s" id="hapS"></div>
    </div>
    <div class="chest" title="Catch falling drops for bonus points"><b>+3 / +10</b><small>Drop Bonus</small></div>
  </section>
</main>

<script>

  }

  /* ---------- feeding ---------- */
  function feed(k, btn) {
    if (busy) return; var f = FOOD[k];
    if (G.hunger >= 96) { say("I'm full!"); toast(C.name + ' is full. Try again later.'); return; }
    if (G.points < f.cost) { poorMsg('Not enough points for ' + f.name + '.'); return; }
    G.points -= f.cost; setBusy(true); ui(); save();
    var s = sRect(), b = btn.getBoundingClientRect(), el = document.createElement('div'); el.className = 'fly';
    el.innerHTML = '<svg viewBox="-24 -24 48 48">' + ICONS[k] + '</svg>'; stage.appendChild(el);

  /* ---------- water ---------- */

    later(function () { clearInterval(iv); }, W.end + 50);
