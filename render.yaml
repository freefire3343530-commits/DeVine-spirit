services:
  - type: web
    name: divine-spirit-api
    runtime: node
    buildCommand: npm install --omit=dev && npm run vendor
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: SERVE_WEB, value: "1" }
      - { key: TRUST_PROXY, value: "1" }
      - { key: BOT_TOKEN, sync: false }
      - { key: SESSION_SECRET, generateValue: true }
      - { key: MONGODB_URI, sync: false }
      - { key: ALLOWED_ORIGIN, sync: false }
      - { key: ADMIN_ACCOUNTS, sync: false }
      - { key: ADS_SECRET, sync: false }
