<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}</style>
<title>Sunling</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Hanken+Grotesk:wght@400;600&display=swap">
<style>
/* Layout: status strip, one tall sunflower-field stage, three care buttons, and a snack shelf that opens below. Light-only by design. */
:root {
  --bg: #fff3d4; --fg: #3a2208; --muted: #8a6a3a; --panel: #fffaf0; --line: #f0d08a; --chip: #ffecbb; --track: #f2dca0;
  --accent: #e8801a; --accent-fg: #ffffff; --good: #f5b020; --warn: #ee7a1a; --bad: #d9381e;
  --bubble-bg: #ffffff; --bubble-fg: #3a2208; --star: #f0a010;
  --display: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.5;
  padding-block: 24px 44px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 20px; }
h1 { font-family: var(--display); font-weight: 600; font-size: clamp(30px, 5vw, 40px); line-height: 1.1; margin: 0; color: #c8620a; }
.hint { margin: 0; color: var(--muted); font-size: 14px; min-width: 0; }

.status { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.points { display: flex; align-items: center; gap: 8px; padding: 6px 14px 6px 10px; border-radius: 12px; background: var(--chip); flex: 0 0 auto; }
.points svg { width: 28px; height: 28px; color: var(--star); }
.points b { font-family: var(--display); font-weight: 600; font-size: 28px; line-height: 1; min-width: 2ch; text-align: right; font-variant-numeric: tabular-nums; }
.points span { font-size: 13px; color: var(--muted); }
.points.bump { animation: bump .35s ease; }
.points.nope { animation: nope .35s ease; }
.meters { flex: 1 1 360px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 16px; min-width: 0; }
@media (max-width: 640px) { .meters { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.meter { display: flex; align-items: center; gap: 8px; min-width: 0; }
.meter svg { width: 22px; height: 22px; flex: 0 0 auto; color: var(--muted); }
.mt { flex: 1; min-width: 0; }
.ml { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--muted); }
.ml em { font-style: normal; color: var(--fg); font-variant-numeric: tabular-nums; }
.bar { height: 9px; border-radius: 99px; background: var(--track); overflow: hidden; margin-top: 3px; }
.bar i { display: block; height: 100%; width: 50%; border-radius: 99px; background: var(--good); transition: width .4s ease, background-color .4s ease; }
.bar i.warn { background: var(--warn); }
.bar i.bad { background: var(--bad); }

.stage { position: relative; overflow: hidden; border-radius: 20px; border: 1px solid var(--line); height: clamp(440px, 66vw, 640px); background: #8fd2f6; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.stage svg { display: block; width: 100%; height: 100%; }
.toast { position: absolute; left: 50%; top: 12px; transform: translate(-50%, -8px); max-width: calc(100% - 24px); background: var(--bubble-bg); color: var(--bubble-fg); padding: 8px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; text-align: center; opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease; box-shadow: 0 4px 16px rgba(0,0,0,.4); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.act { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 64px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font: inherit; cursor: pointer; text-align: left; }
.act svg { width: 34px; height: 34px; flex: 0 0 auto; }
.act b { display: block; font-family: var(--display); font-weight: 600; font-size: 18px; line-height: 1.1; }
.act small { color: var(--muted); font-size: 13px; }
.act:hover:not(:disabled) { border-color: var(--accent); }
.act[aria-expanded="true"] { border-color: var(--accent); background: var(--chip); }
.act:disabled { opacity: .55; cursor: default; }
@media (max-width: 560px) { .act { flex-direction: column; text-align: center; gap: 4px; padding: 10px 6px; } }

.shelf { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.shelf h2 { margin: 0; font: 600 12px var(--body); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.note { margin: 0; font-size: 14px; color: var(--muted); }
.foods { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; }
.food { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px; border: 1px solid var(--line); border-radius: 14px; background: var(--chip); color: var(--fg); font: inherit; cursor: pointer; min-width: 0; }
.food:hover:not(:disabled) { border-color: var(--accent); }
.food:disabled { opacity: .55; cursor: default; }
.food.poor { opacity: .5; }
.food svg { width: 46px; height: 46px; }
.food .nm { font-weight: 600; font-size: 14px; text-align: center; }
.food .pr { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
.food .pr svg { width: 14px; height: 14px; color: var(--star); }
button:focus-visible, #hits:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- scene + character ---------- */
.tw2 { animation: starblink 3s ease-in-out infinite alternate; } .tw2.b { animation-delay: -1.2s; } .tw2.c { animation-delay: -2.1s; }
.aur { animation: aurora 12s ease-in-out infinite alternate; } .aur.b { animation-delay: -5s; animation-duration: 16s; }
.shoot { animation: shoot 11s linear infinite; }
.sw { transform-box: fill-box; transform-origin: 50% 100%; animation: bladesway 5s ease-in-out infinite alternate; }
.sw.s2 { animation-duration: 6.4s; animation-delay: -2s; } .sw.s3 { animation-duration: 4.2s; animation-delay: -1s; }
.sw.s4 { animation-duration: 7.2s; animation-delay: -4s; } .sw.s5 { animation-duration: 5.6s; animation-delay: -3s; }
.sw.f { animation-name: bladesway2; }
.em { animation: emrise var(--d, 10s) linear infinite; }
.cl { animation: drift linear infinite; }
.glowp { animation: lavapulse 5s ease-in-out infinite alternate; }

#bounce { transform-box: fill-box; transform-origin: 50% 100%; }
#squash { transform-box: fill-box; transform-origin: 50% 100%; animation: idle 3.2s ease-in-out infinite; }
.arm { transform-origin: 0 0; }
.armpos { transform: translate(var(--hx, 0px), var(--hy, 0px)); transition: transform .28s cubic-bezier(.3,1.4,.5,1); }
#head { transform-origin: 120px 186px; transition: transform .25s ease; }
#moonGlow { transform-origin: 110px 96px; transition: transform .6s ease, opacity .6s ease; }
.swing { animation: swing 2.6s ease-in-out infinite alternate; } .swing.b { animation-duration: 3.2s; animation-delay: -1s; } .swing.c { animation-duration: 2.2s; animation-delay: -.5s; }
#rig { transition: filter 1s ease; }
.eyes { transform-box: fill-box; transform-origin: 50% 50%; }
.eyes.blink { animation: blink 4.6s infinite; }
.fl { animation: floaty 1.8s ease-in-out infinite; }
.tw { transform-box: fill-box; transform-origin: 50% 50%; animation: twinkle 1.1s ease-in-out infinite; }
.smk { animation: smoke 2.6s ease-out infinite; }
.fb { transform-box: fill-box; transform-origin: 50% 50%; transition: transform .25s ease, opacity .25s ease; }
.fb.pop { transform: scale(1.7); opacity: 0; }
#hits { cursor: pointer; }
#hits ellipse { fill: #000; fill-opacity: 0; }

#actor.hop #bounce { animation: hopup .55s ease-out; }
#actor.giggle #bounce { animation: giggle .6s ease-in-out; }
#actor.wiggle #bounce { animation: wig .5s ease-in-out; }
#actor.chew #squash { animation: chew .32s ease-in-out infinite; }
#actor.shiver #bounce { animation: shiv .09s linear infinite; }
#head.x-sad { transform: translateY(2px); } #head.x-shy { transform: rotate(3deg); }
#head.x-thinking { transform: rotate(-3deg); } #head.x-hurt { transform: translateY(2px) rotate(-2deg); }
#head.x-scared { animation: shake .12s linear infinite; } #head.x-angry { animation: pulse .55s ease-in-out infinite; }
#head.x-excited { animation: hop .46s ease-in-out infinite; } #head.x-sleepy { animation: nod 3.2s ease-in-out infinite; }
.sd .pulse { transform-box: fill-box; transform-origin: 50% 50%; animation: sunpulse 1.4s ease-in-out infinite; }
#bubble { transition: opacity .3s ease; }
#gDim { transition: opacity .9s ease; }

@keyframes bump { 40% { transform: scale(1.12); } }
@keyframes nope { 20%,60% { transform: translateX(-5px); } 40%,80% { transform: translateX(5px); } }
@keyframes starblink { from { opacity: .35; } to { opacity: 1; } }
@keyframes aurora { from { opacity: .16; transform: translateX(-24px); } to { opacity: .34; transform: translateX(24px); } }
@keyframes shoot { 0% { transform: translate(0,0); opacity: 0; } 3% { opacity: 1; } 11% { transform: translate(-460px,240px); opacity: 0; } 100% { transform: translate(-460px,240px); opacity: 0; } }
@keyframes bladesway { from { transform: rotate(-1.4deg); } to { transform: rotate(1.6deg); } }
@keyframes bladesway2 { from { transform: rotate(-2.4deg); } to { transform: rotate(2.6deg); } }
@keyframes emrise { 0% { transform: translate(0,0); opacity: 0; } 10% { opacity: 1; } 100% { transform: translate(var(--dx, 40px), -520px); opacity: 0; } }
@keyframes drift { from { transform: translateX(-220px); } to { transform: translateX(1180px); } }
@keyframes lavapulse { from { opacity: .55; } to { opacity: 1; } }
@keyframes swing { from { transform: rotate(-9deg); } to { transform: rotate(9deg); } }
@keyframes idle { 0%,100% { transform: translateY(0) scale(1,1); } 50% { transform: translateY(-7px) scale(1.012,.988); } }
@keyframes blink { 0%,93%,100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }
@keyframes shake { 0%,100% { transform: translateX(-1.4px); } 50% { transform: translateX(1.4px); } }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.025); } }
@keyframes hop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes nod { 0%,100% { transform: rotate(-1deg); } 50% { transform: rotate(5deg) translateY(2px); } }
@keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes twinkle { 0%,100% { transform: scale(.6); opacity: .6; } 50% { transform: scale(1.15); opacity: 1; } }
@keyframes smoke { 0% { transform: translateY(0) scale(.6); opacity: .8; } 100% { transform: translateY(-26px) scale(1.5); opacity: 0; } }
@keyframes hopup { 0% { transform: translateY(0) scale(1,1); } 30% { transform: translateY(-46px) scale(.94,1.08); } 62% { transform: translateY(0) scale(1.08,.9); } 100% { transform: translateY(0) scale(1,1); } }
@keyframes giggle { 0%,100% { transform: rotate(0) translateY(0); } 20% { transform: rotate(-3deg) translateY(-8px); } 40% { transform: rotate(3deg) translateY(0); } 60% { transform: rotate(-3deg) translateY(-8px); } 80% { transform: rotate(2deg) translateY(0); } }
@keyframes wig { 0%,100% { transform: rotate(0); } 20% { transform: rotate(-5deg); } 45% { transform: rotate(5deg); } 70% { transform: rotate(-3deg); } }
@keyframes chew { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.04,.95); } }
@keyframes shiv { 0%,100% { transform: translateX(-2px); } 50% { transform: translateX(2px); } }
@keyframes sunpulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }

@media (prefers-reduced-motion: reduce) {
  .tw2, .aur, .shoot, .sw, .em, .cl, .glowp, .swing, .eyes.blink, .fl, .tw, .smk, #squash, .sd .pulse, #head[class*="x-"] { animation: none !important; }
}

#moonGlow { transform-origin: 120px 122px; }
.ray1 { transform-origin: 120px 132px; animation: raysway 7s ease-in-out infinite alternate; }
.ray2 { transform-origin: 120px 132px; animation: raysway 9s ease-in-out infinite alternate-reverse; }
.ray3 { transform-origin: 120px 132px; animation: raysway 5.5s ease-in-out infinite alternate; }
#cape { transform-origin: 120px 190px; animation: sway-s 3.2s ease-in-out infinite; }
.rays { transform-origin: 780px 110px; animation: raysway2 14s ease-in-out infinite alternate; }
.mill { animation: spinmill 16s linear infinite; }
@keyframes raysway { from { transform: rotate(-2.5deg); } to { transform: rotate(2.5deg); } }
@keyframes raysway2 { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
@keyframes sway-s { 0%,100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
@keyframes spinmill { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .ray1, .ray2, .ray3, #cape, .rays, .mill { animation: none !important; } }

/* ---- DeVine single-screen layout ---- */
html,body{height:100%;margin:0;overflow:hidden}
body{padding:0!important;min-height:0!important}
.wrap{height:100vh;height:100dvh;max-width:520px;margin:0 auto;gap:6px;padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto auto}
.dv-head{display:flex;flex-wrap:nowrap;align-items:center;justify-content:flex-start;gap:8px}
.dv-back{flex:0 0 auto;width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);display:grid;place-items:center;cursor:pointer;padding:0}
.dv-back svg{width:18px;height:18px}
.dv-t{flex:1 1 auto;min-width:0;text-align:center}
.dv-t h1{font-size:clamp(22px,6vw,28px);line-height:1.05}
.dv-t .hint{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dv-badge{flex:0 0 auto;font:700 8px var(--body);letter-spacing:.06em;padding:5px 7px;border-radius:999px;background:var(--accent);color:var(--accent-fg);text-align:center;line-height:1.15}
.status{flex-wrap:nowrap;gap:6px;padding:6px 8px;border-radius:14px}
.points{padding:3px 7px;gap:4px}.points svg{width:18px;height:18px}.points b{font-size:18px}.points span{display:none}
.meters{flex:1 1 auto;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:6px}
.meter{flex-direction:column;align-items:stretch;gap:0}
.meter svg{display:none}
.ml{font-size:10px;gap:3px}.bar{height:6px;margin-top:2px}
.bar i{width:100%!important;transform-origin:0 50%;transform:scaleX(.5);transition:transform .4s ease,background-color .4s ease!important;will-change:transform}
.wrap>.stage{grid-area:3/1;height:auto;min-height:0;border-radius:16px}
.wrap>.actions{grid-area:3/1;z-index:3;justify-self:end;align-self:center;display:flex;flex-direction:column;gap:8px;width:min(36%,136px);padding-right:6px;pointer-events:none}
.act{pointer-events:auto;flex-direction:row!important;text-align:left!important;min-height:0;padding:7px 10px!important;gap:7px!important;border-radius:999px;color:#fff;border:1.5px solid rgba(255,255,255,.4);box-shadow:0 3px 8px rgba(0,0,0,.3)}
.act:nth-child(1){background:linear-gradient(#58b53b,#2b7a1f)}
.act:nth-child(2){background:linear-gradient(#45a5ee,#1d64b4)}
.act:nth-child(3){background:linear-gradient(#a666e8,#6a35b0)}
.act[aria-expanded="true"]{border-color:#fff}
.act svg{width:26px;height:26px}
.act b{font-size:15px!important}.act small{color:rgba(255,255,255,.88)!important;font-size:10.5px!important;display:block;line-height:1.1}
.shelf{padding:6px 8px 8px;gap:5px;border-radius:14px}
.shelf h2{text-align:center;font-size:12px;color:var(--accent)}
.shelf .note{display:none}
.foods{grid-template-columns:none!important;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
.food{padding:5px 2px;gap:1px}.food svg{width:34px;height:34px}.food .nm{font-size:11.5px;line-height:1.1}.food .pr{font-size:12px}.food .pr svg{width:12px;height:12px}
.dv-hb{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 10px;display:flex;flex-direction:row;align-items:center;gap:10px}
.dv-hb>svg{width:28px;height:28px;flex:0 0 auto}
.dv-hbm{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:4px}
.dv-hbh{display:flex;justify-content:space-between;align-items:center;font:700 11px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.dv-hbh em{font-style:normal;color:var(--fg)}
.dv-hbbar{height:9px;border-radius:99px;background:var(--track);overflow:hidden}
.dv-hbbar i{display:block;height:100%;width:100%;border-radius:99px;background:var(--accent);transform-origin:0 50%;transform:scaleX(.7);transition:transform .4s ease}
.dv-bonus{flex:0 0 auto;width:46px;height:46px;border-radius:50%;background:radial-gradient(#ffe27a,#e0a21a);color:#4a2d00;display:grid;place-content:center;text-align:center;border:2px solid #fff3b0;font-family:var(--display)}
.dv-bonus b{font-size:15px;line-height:1}.dv-bonus small{font-size:8px;line-height:1;font-weight:700}
html.lite .tw2,html.lite .ff,html.lite .em{animation:none!important}
/* shift scene left so action pills don't cover the character */
.wrap>.stage svg{width:calc(100% + 64px);margin-left:-64px}
@media (max-width:360px){.ml{flex-direction:column;gap:0}.act small{display:none}.act{padding:7px 8px!important}.wrap>.actions{width:min(34%,112px)}}
@media (max-height:640px){.food svg{width:28px;height:28px}.dv-t .hint{display:none}}
</style>

      <defs>
        <linearGradient id="gSky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#3a98ea"/><stop offset=".45" stop-color="#8fd2f6"/><stop offset=".8" stop-color="#fff0b0"/><stop offset="1" stop-color="#ffd070"/>
        </linearGradient>
        <linearGradient id="gGrass" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#bcd844"/><stop offset=".4" stop-color="#7aa828"/><stop offset="1" stop-color="#3e6a14"/>
        </linearGradient>
        <radialGradient id="gSpot" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff3a0" stop-opacity=".55"/><stop offset="1" stop-color="#fff3a0" stop-opacity="0"/></radialGradient>
        <radialGradient id="gSunGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff6a0" stop-opacity=".9"/><stop offset="1" stop-color="#ffd23f" stop-opacity="0"/></radialGradient>
        <radialGradient id="gBlueGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#d6f0ff" stop-opacity=".9"/><stop offset="1" stop-color="#3a8aff" stop-opacity="0"/></radialGradient>
        <radialGradient id="gSunCore" cx=".38" cy=".34" r=".8"><stop offset="0" stop-color="#fffbd0"/><stop offset=".55" stop-color="#ffd83a"/><stop offset="1" stop-color="#f0a010"/></radialGradient>
        <radialGradient id="gBlueCore" cx=".38" cy=".34" r=".8"><stop offset="0" stop-color="#ffffff"/><stop offset=".5" stop-color="#7fd0ff"/><stop offset="1" stop-color="#2a6adf"/></radialGradient>
        <radialGradient id="gCharGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff3a0" stop-opacity=".75"/><stop offset=".6" stop-color="#ffc83a" stop-opacity=".25"/><stop offset="1" stop-color="#ffb02e" stop-opacity="0"/></radialGradient>
        <radialGradient id="iris" cx=".4" cy=".3" r=".85"><stop offset="0" stop-color="#ffc06a"/><stop offset=".55" stop-color="#d8661a"/><stop offset="1" stop-color="#7a2a08"/></radialGradient>

      pts.push(ex ? { x: 120 + Math.cos(ang2) * 66 * rad, y: 116 + Math.sin(ang2) * 56 * rad, r: rr(7, 14) } : { x: 120 + Math.cos(ang2) * 44 * rad, y: 218 + Math.sin(ang2) * 40 * rad, r: rr(7, 13) });
    }
    foam = pts.map(function (p, n) { p.popped = false; p.id = 'fb' + n; h += '<circle id="' + p.id + '" class="fb" cx="' + f(p.x) + '" cy="' + f(p.y) + '" r="' + f(p.r) + '" fill="url(#gDust)" stroke="#5a4028" stroke-width="1.4" opacity=".92"/><circle class="fb" cx="' + f(p.x - p.r * .3) + '" cy="' + f(p.y - p.r * .35) + '" r="' + f(p.r * .2) + '" fill="#fff" opacity=".5"/>'; return p; });
    foamG.innerHTML = h; total = foam.length; popped = 0; scrubMode = true;
    setFace('shy'); stage.style.touchAction = 'none';
    sticky('Rub the mud away! Drag across Sunling.'); say('Eek, I am all muddy!');
  }
  function popFoam(b) {
    b.popped = true; popped++;
    var el = $(b.id); el.setAttribute('class', 'fb pop'); if (el.nextSibling) el.nextSibling.setAttribute('class', 'fb pop');
    var s2 = rigToScene(b.x, b.y); part('spark', s2.x, s2.y, { life: .5, s: .7, col: '#ffe9a0' });
    if (Math.random() < .35) { pulse('giggle', 600); setFace(Math.random() < .5 ? 'happy' : 'shy'); }
  }
  function scrub(e) {
    if (!scrubMode) return;
    if (!(pressed || e.pointerType === 'mouse')) return;
    var p = toRig(e.clientX, e.clientY), n = 0;
    foam.forEach(function (b) { if (!b.popped) { var dx = b.x - p.x, dy = b.y - p.y; if (dx * dx + dy * dy < (b.r + 18) * (b.r + 18)) { popFoam(b); n++; } } });
    if (n) { sticky('Wiping... ' + Math.round(popped / total * 100) + '%'); if (popped >= total * .9) shine(); }
  }
  svg.addEventListener('pointerdown', function () { pressed = true; });
  addEventListener('pointerup', function () { pressed = false; }); addEventListener('pointercancel', function () { pressed = false; });
  svg.addEventListener('pointermove', scrub);
  svg.addEventListener('pointerdown', function (e) { scrub(e); });
  function shine() {
    if (!scrubMode) return; scrubMode = false; stage.style.touchAction = '';
    foam.forEach(function (b) { if (!b.popped) popFoam(b); });
    toast('Shining up...'); setFace('surprised'); pulse('shiver', 600);
    later(function () {
      foamG.innerHTML = ''; G.clean = 100; G.mood = clamp(G.mood + 12, 0, 100); boost = 2;
      react('excited', 2800, 'hop'); say('I am sparkling clean!', 2800); sparks(480, 340, 16, 90); hearts(480, 320, 3);
      part('ring', 480, 340, { life: .7, col: '#ffe9a0', s: 2 }); part('ring', 480, 340, { life: .9, col: '#fff', s: 3 });
      toast('Spotless! Clean 100%, mood +12.'); save(); uiUpdate(); later(function () { setBusy(false); }, 1500);
    }, 800);
  }
  bClean.addEventListener('click', function (e) { clean(); if (e.detail) bClean.blur(); });

  /* =============== MAIN LOOP =============== */
  var last = performance.now(), uiAcc = 0, saveAcc = 0, hintAcc = 0, time = 0;
  function frame(t) {
    var dt = Math.min(.1, (t - last) / 1000); last = t; time += dt;
    if (!busy) {
      G.hunger = clamp(G.hunger - .2 * dt, 0, 100); G.energy = clamp(G.energy - .26 * dt, 0, 100); G.clean = clamp(G.clean - .14 * dt, 0, 100);
      var low = Math.min(G.hunger, G.energy, G.clean);
      G.mood = clamp(G.mood - (low < 25 ? .5 : low > 60 ? .05 : .15) * dt, 0, 100);
    }
    if (boost > 0) boost = Math.max(0, boost - dt * .7);
    if (resting) {
      G.energy = clamp(G.energy + 22 * dt, 0, 100);
      noteAcc += dt; if (noteAcc > .32) { noteAcc = 0; part('text', 480 + rr(-90, 90), 360 + rr(-40, 20), { text: ['♪', '♫', '★'][Math.floor(Math.random() * 3)], col: '#ffe9a0', size: rr(22, 32), vy: -50, vx: rr(-14, 14), life: 1.6 }); }
    }
    updateParticles(dt); updateDrops(dt, time); glowUpdate();
    BF.forEach(function (b, n) {
      var tt = time * b[6] + b[7], x = b[2] + Math.sin(tt * 1.3) * b[4] + Math.sin(tt * 2.9) * 20, y = b[3] + Math.sin(tt * 1.9) * b[5] + Math.cos(tt * 3.3) * 9;
      var dx = Math.cos(tt * 1.3) * b[4] * 1.3 * b[6], ang = f(clamp(dx * 2, -35, 35));
      var sx = .25 + .75 * Math.abs(Math.sin(time * 14 + n));
      var g = $('bf' + n); g.setAttribute('transform', 'translate(' + f(x) + ' ' + f(y) + ') rotate(' + ang + ')');
      g.childNodes[1].setAttribute('transform', 'scale(' + f(sx) + ' 1)');
    });
    uiAcc += dt; if (uiAcc > .25) { uiAcc = 0; uiUpdate(); if (!busy && performance.now() > reactUntil) autoFace(); }
    saveAcc += dt; if (saveAcc > 4) { saveAcc = 0; save(); }
    hintAcc += dt; if (hintAcc > 22 && !busy) {
      hintAcc = 0;
      if (G.hunger < 28) say('I am so hungry...', 2600); else if (G.energy < 28) say('My light is getting dim...', 2600); else if (G.clean < 28) say('I feel muddy.', 2600);
    }
    fpsCheck(dt);
    if (document.hidden) loopOn = false; else requestAnimationFrame(frame);
  }

  setFace('neutral'); uiUpdate(); glowUpdate();
  later(function () { say('Hi! Tap me to say hello.', 3200); }, 900);
  addEventListener('pagehide', save);
  document.addEventListener('visibilitychange', function () { if (!document.hidden && !loopOn) { loopOn = true; last = performance.now(); requestAnimationFrame(frame); } });
  requestAnimationFrame(frame);
})();
</script>
