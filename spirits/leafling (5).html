<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:light}body{margin:0}</style>
<title>Leafling</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Hanken+Grotesk:wght@400;600&display=swap">
<style>
/* Layout: status strip on top, one tall meadow stage, three care buttons, and a snack shelf that opens below. */
:root {
  --bg: #eaf2dc; --fg: #1b2a17; --muted: #52674b; --panel: #f7faee; --line: #cadcb6; --chip: #e1ecd0; --track: #d3e2c0;
  --accent: #3a8a28; --accent-fg: #ffffff; --good: #3f9a2e; --warn: #e0a21a; --bad: #d9482f;
  --bubble-bg: #ffffff; --bubble-fg: #1b2a17;
  --sky-a: #4fa9ee; --sky-b: #9fd8f6; --sky-c: #f7f1c6; --sun: #fff3a8; --crater-op: 0;
  --cloud: #ffffff; --cloud-shade: #d4e5f4; --mtn-far: #9ab8d6; --mtn-near: #80a9b6; --snow: #f4f9ff; --haze: #dff0f5;
  --hill-a: #6db35a; --hill-b: #58a443; --tree-dark: #2f7a3a; --tree-light: #55a84c; --trunk: #6b4a2a;
  --meadow-a: #6cc04a; --meadow-b: #3b8a2c; --spot-c: #fff6b0; --spot-o: .5;
  --blade-1: #4aa23a; --blade-2: #66bb48; --blade-3: #90d45a;
  --front-1: #2b7a2a; --front-2: #3f9a35; --front-3: #5fb843;
  --fence: #cf9f66; --fence-dark: #9a6f3e; --mill: #f3e6c8; --roof: #b4533a;
  --ray-op: .2; --star-op: 0; --firefly-op: 0; --tint-op: 0; --petal-op: .85; --shadow: rgba(20,50,10,.32);
  --display: 'Fredoka', 'Trebuchet MS', system-ui, sans-serif;
  --body: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1710; --fg: #e1eed4; --muted: #94ab88; --panel: #16211a; --line: #2a3b2d; --chip: #1f2f22; --track: #243528;
    --accent: #86d055; --accent-fg: #0f1e0b; --good: #6cc24a; --warn: #f0b83a; --bad: #ff6a50;
    --bubble-bg: #1c2b3a; --bubble-fg: #e8f2ff;
    --sky-a: #090e2c; --sky-b: #1b2a5a; --sky-c: #4b5088; --sun: #e8efff; --crater-op: .5;
    --cloud: #5a6998; --cloud-shade: #3a4676; --mtn-far: #2b3668; --mtn-near: #233a5c; --snow: #a9b7e6; --haze: #3a4a86;
    --hill-a: #1f4a4c; --hill-b: #1b4a3c; --tree-dark: #12393a; --tree-light: #1d5a47; --trunk: #2a2a2a;
    --meadow-a: #1f6a45; --meadow-b: #0e382b; --spot-c: #aac8ff; --spot-o: .28;
    --blade-1: #1f6a3d; --blade-2: #2a8a50; --blade-3: #46b070;
    --front-1: #0e4a2b; --front-2: #167a45; --front-3: #26a05f;
    --fence: #6a5a4a; --fence-dark: #4a3d33; --mill: #8c8caa; --roof: #5a3050;
    --ray-op: .12; --star-op: 1; --firefly-op: 1; --tint-op: .3; --petal-op: .35; --shadow: rgba(0,0,0,.45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1710; --fg: #e1eed4; --muted: #94ab88; --panel: #16211a; --line: #2a3b2d; --chip: #1f2f22; --track: #243528;
  --accent: #86d055; --accent-fg: #0f1e0b; --good: #6cc24a; --warn: #f0b83a; --bad: #ff6a50;
  --bubble-bg: #1c2b3a; --bubble-fg: #e8f2ff;
  --sky-a: #090e2c; --sky-b: #1b2a5a; --sky-c: #4b5088; --sun: #e8efff; --crater-op: .5;
  --cloud: #5a6998; --cloud-shade: #3a4676; --mtn-far: #2b3668; --mtn-near: #233a5c; --snow: #a9b7e6; --haze: #3a4a86;
  --hill-a: #1f4a4c; --hill-b: #1b4a3c; --tree-dark: #12393a; --tree-light: #1d5a47; --trunk: #2a2a2a;
  --meadow-a: #1f6a45; --meadow-b: #0e382b; --spot-c: #aac8ff; --spot-o: .28;
  --blade-1: #1f6a3d; --blade-2: #2a8a50; --blade-3: #46b070;
  --front-1: #0e4a2b; --front-2: #167a45; --front-3: #26a05f;
  --fence: #6a5a4a; --fence-dark: #4a3d33; --mill: #8c8caa; --roof: #5a3050;
  --ray-op: .12; --star-op: 1; --firefly-op: 1; --tint-op: .3; --petal-op: .35; --shadow: rgba(0,0,0,.45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.5;
  padding-block: 24px 44px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1000px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 2px 20px; }
h1 { font-family: var(--display); font-weight: 600; font-size: clamp(30px, 5vw, 40px); line-height: 1.1; margin: 0; }
.hint { margin: 0; color: var(--muted); font-size: 14px; min-width: 0; }

.status { display: flex; flex-wrap: wrap; gap: 12px 18px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; }
.points { display: flex; align-items: center; gap: 8px; padding: 6px 14px 6px 10px; border-radius: 12px; background: var(--chip); flex: 0 0 auto; }
.points svg { width: 28px; height: 28px; color: #e8a812; }
.points b { font-family: var(--display); font-weight: 600; font-size: 28px; line-height: 1; min-width: 2ch; text-align: right; font-variant-numeric: tabular-nums; }
.points span { font-size: 13px; color: var(--muted); }
.points.bump { animation: bump .35s ease; }
.points.nope { animation: nope .35s ease; }
.meters { flex: 1 1 360px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px 16px; min-width: 0; }
@media (max-width: 640px) { .meters { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.meter { display: flex; align-items: center; gap: 8px; min-width: 0; }
.meter svg { width: 22px; height: 22px; flex: 0 0 auto; color: var(--muted); }
.mt { flex: 1; min-width: 0; }
.ml { display: flex; justify-content: space-between; font-size: 12px; font-weight: 600; color: var(--muted); }
.ml em { font-style: normal; color: var(--fg); font-variant-numeric: tabular-nums; }
.bar { height: 9px; border-radius: 99px; background: var(--track); overflow: hidden; margin-top: 3px; }
.bar i { display: block; height: 100%; width: 50%; border-radius: 99px; background: var(--good); transition: width .4s ease, background-color .4s ease; }
.bar i.warn { background: var(--warn); }
.bar i.bad { background: var(--bad); }

.stage { position: relative; overflow: hidden; border-radius: 20px; border: 1px solid var(--line); height: clamp(440px, 66vw, 640px); background: var(--sky-b); user-select: none; -webkit-user-select: none; touch-action: manipulation; }
.stage svg { display: block; width: 100%; height: 100%; }
.toast { position: absolute; left: 50%; top: 12px; transform: translate(-50%, -8px); max-width: calc(100% - 24px); background: var(--bubble-bg); color: var(--bubble-fg); padding: 8px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; text-align: center; opacity: 0; pointer-events: none; transition: opacity .25s ease, transform .25s ease; box-shadow: 0 4px 16px rgba(0,0,0,.18); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.act { display: flex; align-items: center; gap: 12px; padding: 12px 14px; min-height: 64px; border-radius: 16px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); font: inherit; cursor: pointer; text-align: left; }
.act svg { width: 34px; height: 34px; flex: 0 0 auto; }
.act b { display: block; font-family: var(--display); font-weight: 600; font-size: 18px; line-height: 1.1; }
.act small { color: var(--muted); font-size: 13px; }
.act:hover:not(:disabled) { border-color: var(--accent); }
.act[aria-expanded="true"] { border-color: var(--accent); background: var(--chip); }
.act:disabled { opacity: .55; cursor: default; }
@media (max-width: 560px) { .act { flex-direction: column; text-align: center; gap: 4px; padding: 10px 6px; } }

.shelf { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.shelf h2 { margin: 0; font: 600 12px var(--body); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.note { margin: 0; font-size: 14px; color: var(--muted); }
.foods { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; }
.food { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px; border: 1px solid var(--line); border-radius: 14px; background: var(--chip); color: var(--fg); font: inherit; cursor: pointer; min-width: 0; }
.food:hover:not(:disabled) { border-color: var(--accent); }
.food:disabled { opacity: .55; cursor: default; }
.food.poor { opacity: .5; }
.food svg { width: 46px; height: 46px; }
.food .nm { font-weight: 600; font-size: 14px; text-align: center; }
.food .pr { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 600; color: var(--muted); }
.food .pr svg { width: 14px; height: 14px; color: #e8a812; }
button:focus-visible, #hits:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- scene + character ---------- */
.cl { animation: drift linear infinite; }
.sw { transform-box: fill-box; transform-origin: 50% 100%; animation: bladesway 5s ease-in-out infinite alternate; }
.sw.s2 { animation-duration: 6.4s; animation-delay: -2s; } .sw.s3 { animation-duration: 4.2s; animation-delay: -1s; }
.sw.s4 { animation-duration: 7.2s; animation-delay: -4s; } .sw.s5 { animation-duration: 5.6s; animation-delay: -3s; }
.sw.f { animation-name: bladesway2; }
.rays { transform-origin: 780px 92px; animation: raysway 14s ease-in-out infinite alternate; }
.mill { animation: spinmill 16s linear infinite; }
.ff { animation: ffloat var(--d, 6s) ease-in-out infinite alternate, ftw 2.4s ease-in-out infinite; }
.pt { animation: petal var(--d, 18s) linear infinite; }
.tw2 { animation: starblink 3s ease-in-out infinite alternate; } .tw2.b { animation-delay: -1.2s; } .tw2.c { animation-delay: -2.1s; }

#bounce { transform-box: fill-box; transform-origin: 50% 100%; }
#squash { transform-box: fill-box; transform-origin: 50% 100%; animation: idle 2.8s ease-in-out infinite; }
.leg { transform-box: fill-box; transform-origin: 50% 0; }
.arm { transform-origin: 0 0; }
.armpos { transform: translate(var(--hx, 0px), var(--hy, 0px)); transition: transform .28s cubic-bezier(.3,1.4,.5,1); }
#head { transform-origin: 120px 186px; transition: transform .25s ease; }
#sprout { transform-origin: 120px 92px; animation: sway 2.8s ease-in-out infinite; transition: transform .8s ease; }
#skirt { transform-origin: 120px 196px; animation: sway-s 3.2s ease-in-out infinite; }
#rig { transition: filter 1s ease; }
.eyes { transform-box: fill-box; transform-origin: 50% 50%; }
.eyes.blink { animation: blink 4.6s infinite; }
.fl { animation: floaty 1.8s ease-in-out infinite; }
.tw { transform-box: fill-box; transform-origin: 50% 50%; animation: twinkle 1.1s ease-in-out infinite; }
.orbit { transform-origin: 120px 100px; animation: orbit 1.3s linear infinite; } .orbit.o2 { animation-duration: .9s; animation-direction: reverse; }
.fb { transform-box: fill-box; transform-origin: 50% 50%; transition: transform .25s ease, opacity .25s ease; }
.fb.pop { transform: scale(1.7); opacity: 0; }
#hits { cursor: pointer; }
#hits ellipse { fill: #000; fill-opacity: 0; }

#actor.hop #bounce { animation: hopup .55s ease-out; }
#actor.giggle #bounce { animation: giggle .6s ease-in-out; }
#actor.wiggle #sprout { animation: wig .5s ease-in-out; }
#actor.chew #squash { animation: chew .32s ease-in-out infinite; }
#actor.shiver #bounce { animation: shiv .09s linear infinite; }
#actor.wilt #sprout { animation: none; transform: rotate(34deg); }
#head.x-sad { transform: translateY(2px); } #head.x-shy { transform: rotate(3deg); }
#head.x-thinking { transform: rotate(-3deg); } #head.x-hurt { transform: translateY(2px) rotate(-2deg); }
#head.x-scared { animation: shake .12s linear infinite; } #head.x-angry { animation: pulse .55s ease-in-out infinite; }
#head.x-excited { animation: hop .46s ease-in-out infinite; } #head.x-sleepy { animation: nod 3.2s ease-in-out infinite; }
.sd .pulse { transform-box: fill-box; transform-origin: 50% 50%; animation: sunpulse 1.4s ease-in-out infinite; }
#bubble { transition: opacity .3s ease; }
#props g.prop { transition: transform .7s cubic-bezier(.3,1.15,.5,1), opacity .4s ease; }

@keyframes bump { 40% { transform: scale(1.12); } }
@keyframes nope { 20%,60% { transform: translateX(-5px); } 40%,80% { transform: translateX(5px); } }
@keyframes drift { from { transform: translateX(-220px); } to { transform: translateX(1180px); } }
@keyframes bladesway { from { transform: rotate(-1.4deg); } to { transform: rotate(1.6deg); } }
@keyframes bladesway2 { from { transform: rotate(-2.4deg); } to { transform: rotate(2.6deg); } }
@keyframes raysway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
@keyframes spinmill { to { transform: rotate(360deg); } }
@keyframes ffloat { from { transform: translate(0,0); } to { transform: translate(var(--dx, 20px), var(--dy, -26px)); } }
@keyframes ftw { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
@keyframes petal { from { transform: translate(40px,-30px) rotate(0); } to { transform: translate(-520px,640px) rotate(540deg); } }
@keyframes starblink { from { opacity: .45; } to { opacity: 1; } }
@keyframes idle { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.015,.975); } }
@keyframes sway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(5deg); } }
@keyframes sway-s { 0%,100% { transform: rotate(-1.5deg); } 50% { transform: rotate(1.5deg); } }
@keyframes blink { 0%,93%,100% { transform: scaleY(1); } 96% { transform: scaleY(.08); } }
@keyframes shake { 0%,100% { transform: translateX(-1.4px); } 50% { transform: translateX(1.4px); } }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.025); } }
@keyframes hop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes nod { 0%,100% { transform: rotate(-1deg); } 50% { transform: rotate(5deg) translateY(2px); } }
@keyframes floaty { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
@keyframes twinkle { 0%,100% { transform: scale(.6); opacity: .6; } 50% { transform: scale(1.15); opacity: 1; } }
@keyframes orbit { to { transform: rotate(360deg); } }
@keyframes hopup { 0% { transform: translateY(0) scale(1,1); } 30% { transform: translateY(-46px) scale(.94,1.08); } 62% { transform: translateY(0) scale(1.08,.9); } 100% { transform: translateY(0) scale(1,1); } }
@keyframes giggle { 0%,100% { transform: rotate(0) translateY(0); } 20% { transform: rotate(-3deg) translateY(-8px); } 40% { transform: rotate(3deg) translateY(0); } 60% { transform: rotate(-3deg) translateY(-8px); } 80% { transform: rotate(2deg) translateY(0); } }
@keyframes wig { 0%,100% { transform: rotate(0); } 20% { transform: rotate(-26deg); } 45% { transform: rotate(24deg); } 70% { transform: rotate(-14deg); } }
@keyframes chew { 0%,100% { transform: scale(1,1); } 50% { transform: scale(1.04,.95); } }
@keyframes shiv { 0%,100% { transform: translateX(-2px); } 50% { transform: translateX(2px); } }
@keyframes sunpulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }

@media (prefers-reduced-motion: reduce) {
  .cl, .sw, .rays, .mill, .ff, .pt, .tw2, #sprout, #skirt, .eyes.blink, .fl, .tw, #squash, .sd .pulse, #head[class*="x-"] { animation: none !important; }
}

/* ---- DeVine single-screen layout ---- */
html,body{height:100%;margin:0;overflow:hidden}
body{padding:0!important;min-height:0!important}
.wrap{height:100vh;height:100dvh;max-width:520px;margin:0 auto;gap:6px;padding:8px 10px;padding-bottom:max(8px,env(safe-area-inset-bottom));display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto auto}
.dv-head{display:flex;flex-wrap:nowrap;align-items:center;justify-content:flex-start;gap:8px}
.dv-back{flex:0 0 auto;width:36px;height:36px;border-radius:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);display:grid;place-items:center;cursor:pointer;padding:0}
.dv-back svg{width:18px;height:18px}
.dv-t{flex:1 1 auto;min-width:0;text-align:center}
.dv-t h1{font-size:clamp(22px,6vw,28px);line-height:1.05}
.dv-t .hint{font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dv-badge{flex:0 0 auto;font:700 8px var(--body);letter-spacing:.06em;padding:5px 7px;border-radius:999px;background:var(--accent);color:var(--accent-fg);text-align:center;line-height:1.15}
.status{flex-wrap:nowrap;gap:6px;padding:6px 8px;border-radius:14px}
.points{padding:3px 7px;gap:4px}.points svg{width:18px;height:18px}.points b{font-size:18px}.points span{display:none}
.meters{flex:1 1 auto;grid-template-columns:repeat(4,minmax(0,1fr))!important;gap:6px}
.meter{flex-direction:column;align-items:stretch;gap:0}
.meter svg{display:none}
.ml{font-size:10px;gap:3px}.bar{height:6px;margin-top:2px}
.bar i{width:100%!important;transform-origin:0 50%;transform:scaleX(.5);transition:transform .4s ease,background-color .4s ease!important;will-change:transform}
.wrap>.stage{grid-area:3/1;height:auto;min-height:0;border-radius:16px}
.wrap>.actions{grid-area:3/1;z-index:3;justify-self:end;align-self:center;display:flex;flex-direction:column;gap:8px;width:min(36%,136px);padding-right:6px;pointer-events:none}
.act{pointer-events:auto;flex-direction:row!important;text-align:left!important;min-height:0;padding:7px 10px!important;gap:7px!important;border-radius:999px;color:#fff;border:1.5px solid rgba(255,255,255,.4);box-shadow:0 3px 8px rgba(0,0,0,.3)}
.act:nth-child(1){background:linear-gradient(#58b53b,#2b7a1f)}
.act:nth-child(2){background:linear-gradient(#45a5ee,#1d64b4)}
.act:nth-child(3){background:linear-gradient(#a666e8,#6a35b0)}
.act[aria-expanded="true"]{border-color:#fff}
.act svg{width:26px;height:26px}
.act b{font-size:15px!important}.act small{color:rgba(255,255,255,.88)!important;font-size:10.5px!important;display:block;line-height:1.1}
.shelf{padding:6px 8px 8px;gap:5px;border-radius:14px}
.shelf h2{text-align:center;font-size:12px;color:var(--accent)}
.shelf .note{display:none}
.foods{grid-template-columns:none!important;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px}
.food{padding:5px 2px;gap:1px}.food svg{width:34px;height:34px}.food .nm{font-size:11.5px;line-height:1.1}.food .pr{font-size:12px}.food .pr svg{width:12px;height:12px}
.dv-hb{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:6px 10px;display:flex;flex-direction:row;align-items:center;gap:10px}
.dv-hb>svg{width:28px;height:28px;flex:0 0 auto}
.dv-hbm{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:4px}
.dv-hbh{display:flex;justify-content:space-between;align-items:center;font:700 11px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.dv-hbh em{font-style:normal;color:var(--fg)}
.dv-hbbar{height:9px;border-radius:99px;background:var(--track);overflow:hidden}
.dv-hbbar i{display:block;height:100%;width:100%;border-radius:99px;background:var(--accent);transform-origin:0 50%;transform:scaleX(.7);transition:transform .4s ease}
.dv-bonus{flex:0 0 auto;width:46px;height:46px;border-radius:50%;background:radial-gradient(#ffe27a,#e0a21a);color:#4a2d00;display:grid;place-content:center;text-align:center;border:2px solid #fff3b0;font-family:var(--display)}
.dv-bonus b{font-size:15px;line-height:1}.dv-bonus small{font-size:8px;line-height:1;font-weight:700}
#dvSnd .offx{display:none}#dvSnd.off .on{display:none}#dvSnd.off .offx{display:inline}#dvSnd.off{opacity:.7}
html.lite .tw2,html.lite .ff,html.lite .em{animation:none!important}
/* shift scene left so action pills don't cover the character */
.wrap>.stage svg{width:calc(100% + 64px);margin-left:-64px}
@media (max-width:360px){.ml{flex-direction:column;gap:0}.act small{display:none}.act{padding:7px 8px!important}.wrap>.actions{width:min(34%,112px)}}
@media (max-height:640px){.food svg{width:28px;height:28px}.dv-t .hint{display:none}}
</style>

<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var $ = function (id) { return document.getElementById(id); };
  function f(n) { return Math.round(n * 10) / 10; }
  function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  var R = rng(11);
  function rr(a, b) { return a + (b - a) * R(); }
  function mk(tag, attrs) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); return e; }
  var i, j;

  /* =============== SCENE =============== */
  function yA(x) { return 392 + 14 * Math.sin(x / 120) + 9 * Math.sin(x / 47 + 1); }
  function yB(x) { return 432 + 10 * Math.sin(x / 150 + 2) + 6 * Math.sin(x / 61); }
  function yC(x) { return 462 + 5 * Math.sin(x / 110) + 3 * Math.sin(x / 37); }
  function hillPath(fn, bottom) { var d = 'M-12 ' + bottom + ' L-12 ' + f(fn(-12)); for (var x = 0; x <= 972; x += 12) d += ' L' + x + ' ' + f(fn(x)); return d + ' L972 ' + bottom + 'Z'; }
  function poly(pts, bottom) { return 'M' + pts.map(function (p) { return p[0] + ' ' + p[1]; }).join(' L') + ' L960 ' + bottom + ' L0 ' + bottom + 'Z'; }

  // stars
  var s = '';
  for (i = 0; i < 90; i++) s += '<circle class="tw2 ' + ['', 'b', 'c'][i % 3] + '" cx="' + f(rr(0, 960)) + '" cy="' + f(rr(0, 300)) + '" r="' + f(rr(.6, 1.7)) + '" fill="#fff"/>';
  $('gStars').innerHTML = s;

  // sun / moon
  s = '<g class="rays" style="opacity:var(--ray-op)">';
  for (i = 0; i < 10; i++) {
    var a0 = (98 + i * 7.5) * Math.PI / 180, a1 = a0 - .028, a2 = a0 + .028;
    s += '<polygon points="780,92 ' + f(780 + 820 * Math.cos(a1)) + ',' + f(92 + 820 * Math.sin(a1)) + ' ' + f(780 + 820 * Math.cos(a2)) + ',' + f(92 + 820 * Math.sin(a2)) + '" style="fill:var(--sun)" opacity=".55"/>';
  }
  s += '</g><circle cx="780" cy="92" r="96" style="fill:var(--sun)" opacity=".5" filter="url(#fGlow)"/><circle cx="780" cy="92" r="42" style="fill:var(--sun)"/>' +
    '<g style="opacity:var(--crater-op)" fill="#9aa6d0"><circle cx="768" cy="82" r="8"/><circle cx="792" cy="104" r="6"/><circle cx="790" cy="76" r="4"/></g>';
  $('gSun').innerHTML = s;

  // clouds
  function cloud(x, y, sc, dur, delay) {
    return '<g class="cl" style="animation-duration:' + dur + 's;animation-delay:-' + delay + 's"><g transform="translate(' + x + ' ' + y + ') scale(' + sc + ')">' +
      '<ellipse cx="0" cy="12" rx="62" ry="9" style="fill:var(--cloud-shade)" opacity=".6"/>' +
      '<g style="fill:var(--cloud)"><ellipse cx="0" cy="0" rx="62" ry="17"/><circle cx="-26" cy="-10" r="20"/><circle cx="6" cy="-20" r="27"/><circle cx="38" cy="-8" r="19"/></g></g></g>';
  }
  $('gClouds').innerHTML = cloud(0, 90, 1.1, 150, 40) + cloud(0, 150, .8, 190, 120) + cloud(0, 56, .7, 120, 15) + cloud(0, 190, 1, 230, 170) + cloud(0, 120, .6, 100, 70);

  // mountains
  var mf = [[0, 345], [60, 300], [130, 330], [210, 250], [290, 325], [370, 280], [450, 335], [560, 260], [650, 330], [740, 285], [830, 335], [900, 298], [960, 330]];
  var mn = [[0, 385], [90, 330], [180, 372], [270, 318], [360, 378], [470, 326], [570, 380], [690, 322], [800, 376], [900, 336], [960, 372]];
  function cap(x, y) { return '<path d="M' + x + ' ' + y + ' L' + (x - 17) + ' ' + (y + 25) + ' L' + (x - 7) + ' ' + (y + 19) + ' L' + x + ' ' + (y + 28) + ' L' + (x + 8) + ' ' + (y + 18) + ' L' + (x + 18) + ' ' + (y + 25) + 'Z" style="fill:var(--snow)" opacity=".9"/>'; }
  $('gMtn').innerHTML = '<g filter="url(#fHaze)"><path d="' + poly(mf, 430) + '" style="fill:var(--mtn-far)"/>' + cap(210, 250) + cap(560, 260) + '</g><path d="' + poly(mn, 440) + '" style="fill:var(--mtn-near)" opacity=".92"/>';

  // hill A with trees and windmill
  s = '<path d="' + hillPath(yA, 470) + '" style="fill:var(--hill-a)"/>';
  for (var tx = -10; tx < 975; tx += rr(24, 38)) {
    var ty = yA(tx) + 9, k = rr(.8, 1.45);
    if (R() < .3) {
      s += '<rect x="' + f(tx - 2 * k) + '" y="' + f(ty - 8 * k) + '" width="' + f(4 * k) + '" height="' + f(9 * k) + '" style="fill:var(--trunk)"/>';
      for (j = 0; j < 3; j++) s += '<path d="M' + f(tx) + ' ' + f(ty - (46 - j * 11) * k) + ' L' + f(tx - (13 + j * 4) * k) + ' ' + f(ty - (14 + j * -1) * k - (2 - j) * 4 * k) + ' L' + f(tx + (13 + j * 4) * k) + ' ' + f(ty - (14) * k - (2 - j) * 4 * k) + 'Z" style="fill:var(--tree-dark)"/>';
    } else {
      s += '<rect x="' + f(tx - 2.5 * k) + '" y="' + f(ty - 16 * k) + '" width="' + f(5 * k) + '" height="' + f(18 * k) + '" style="fill:var(--trunk)"/>' +
        '<circle cx="' + f(tx) + '" cy="' + f(ty - 30 * k) + '" r="' + f(19 * k) + '" style="fill:var(--tree-dark)"/>' +
        '<circle cx="' + f(tx - 11 * k) + '" cy="' + f(ty - 23 * k) + '" r="' + f(13 * k) + '" style="fill:var(--tree-dark)"/>' +
        '<circle cx="' + f(tx + 12 * k) + '" cy="' + f(ty - 25 * k) + '" r="' + f(14 * k) + '" style="fill:var(--tree-dark)"/>' +
        '<circle cx="' + f(tx - 5 * k) + '" cy="' + f(ty - 38 * k) + '" r="' + f(10 * k) + '" style="fill:var(--tree-light)" opacity=".85"/>';
    }
  }
  var wy = yA(826) + 10;
  s += '<g transform="translate(826 ' + f(wy) + ')"><path d="M-15 0 L15 0 L9 -72 L-9 -72Z" style="fill:var(--mill)"/><path d="M-13 -72 L13 -72 L0 -94Z" style="fill:var(--roof)"/>' +
    '<rect x="-4" y="-16" width="8" height="16" rx="3" style="fill:var(--roof)"/>' +
    '<g transform="translate(0 -74)"><g class="mill">';
  for (i = 0; i < 4; i++) s += '<g transform="rotate(' + i * 90 + ')"><rect x="-2" y="-48" width="4" height="48" style="fill:var(--fence-dark)"/><rect x="2" y="-48" width="15" height="24" style="fill:var(--mill)" opacity=".92"/></g>';
  s += '</g><circle r="4" style="fill:var(--fence-dark)"/></g></g>';
  $('gHillA').innerHTML = s;

  // hill B with fence
  s = '<path d="' + hillPath(yB, 480) + '" style="fill:var(--hill-b)"/>';
  function fenceRun(x0, x1) {
    var xs = [], x;
    for (x = x0; x <= x1; x += 38) xs.push(x);
    var rail = function (dy) { return 'M' + xs.map(function (x) { return x + ' ' + f(yB(x) + 12 - dy); }).join(' L'); };
    var out = '<path d="' + rail(19) + '" stroke="var(--fence-dark)" stroke-width="4.5" fill="none" stroke-linejoin="round"/><path d="' + rail(8) + '" stroke="var(--fence-dark)" stroke-width="4.5" fill="none" stroke-linejoin="round"/>' +
      '<path d="' + rail(20.5) + '" stroke="var(--fence)" stroke-width="1.6" fill="none"/><path d="' + rail(9.5) + '" stroke="var(--fence)" stroke-width="1.6" fill="none"/>';
    xs.forEach(function (x) {
      var by = yB(x) + 12;
      out += '<path d="M' + (x - 3.5) + ' ' + f(by + 2) + ' V' + f(by - 24) + ' L' + x + ' ' + f(by - 29) + ' L' + (x + 3.5) + ' ' + f(by - 24) + ' V' + f(by + 2) + 'Z" style="fill:var(--fence)" stroke="var(--fence-dark)" stroke-width="1.2" stroke-linejoin="round"/>';
    });
    return out;
  }
  $('gHillB').innerHTML = s + fenceRun(14, 320) + fenceRun(650, 950);

  // meadow ground
  s = '<path d="' + hillPath(yC, 620) + '" fill="url(#gMeadow)"/>';
  for (i = 0; i < 8; i++) {
    var sx = -40 + i * 150;
    s += '<polygon points="' + sx + ',460 ' + (sx + 66) + ',460 ' + (sx + 200) + ',620 ' + (sx + 90) + ',620" fill="#fff" opacity="' + (i % 2 ? .05 : .02) + '"/>';
  }
  s += '<ellipse cx="480" cy="518" rx="330" ry="58" fill="url(#gSpot)"/>';
  $('gGround').innerHTML = s;

  // grass blades
  function blade(x, y, h, w, bend) {
    return 'M' + f(x - w / 2) + ' ' + f(y) + ' Q' + f(x - w / 4 + bend * .3) + ' ' + f(y - h * .6) + ' ' + f(x + bend) + ' ' + f(y - h) +
      ' Q' + f(x + w / 4 + bend * .5) + ' ' + f(y - h * .5) + ' ' + f(x + w / 2) + ' ' + f(y) + 'Z';
  }
  function grass(groupId, tufts, y0, y1, hMin, hMax, cols, groups, cls) {
    var gs = [];
    for (i = 0; i < groups; i++) gs.push('');
    for (i = 0; i < tufts; i++) {
      var bx = rr(-10, 970), by = rr(y0, y1), depth = (by - y0) / (y1 - y0), g = i % groups;
      var cnt = 3 + Math.floor(R() * 3);
      for (j = 0; j < cnt; j++) {
        var h = (hMin + (hMax - hMin) * (.35 + .65 * depth)) * rr(.7, 1.25);
        gs[g] += '<path d="' + blade(bx + rr(-7, 7), by, h, rr(3, 5.5) * (.7 + depth * .6), rr(-9, 9)) + '" style="fill:var(--' + cols[Math.floor(R() * cols.length)] + ')"/>';
      }
    }
    var out = '';
    for (i = 0; i < groups; i++) out += '<g class="sw s' + (i + 1) + (cls ? ' ' + cls : '') + '">' + gs[i] + '</g>';
    $(groupId).innerHTML = out;
  }
  grass('gBack', 150, 466, 548, 12, 26, ['blade-1', 'blade-2', 'blade-3'], 5, '');

  // flowers
  function flower(x, y, sc, type) {
    var h = (16 + (y - 462) * .3 + rr(0, 10)) * sc, bend = rr(-5, 5) * sc, hx = x + bend, hy = y - h, o;
    o = '<path d="M' + f(x) + ' ' + f(y) + ' Q' + f(x + bend * .2) + ' ' + f(y - h * .5) + ' ' + f(hx) + ' ' + f(hy) + '" stroke="#3b8a32" stroke-width="' + f(1.8 * sc) + '" fill="none" stroke-linecap="round"/>' +
      '<ellipse cx="' + f(x + 4 * sc) + '" cy="' + f(y - h * .35) + '" rx="' + f(4.2 * sc) + '" ry="' + f(1.8 * sc) + '" fill="#4aa03c"/>';
    o += '<g transform="translate(' + f(hx) + ' ' + f(hy) + ') scale(' + f(sc) + ')">';
    if (type === 0) {
      for (var p = 0; p < 8; p++) o += '<ellipse cx="0" cy="-5" rx="2.3" ry="5" fill="#fff" stroke="#d6dfe8" stroke-width=".6" transform="rotate(' + p * 45 + ')"/>';
      o += '<circle r="2.8" fill="#ffcc2e"/>';
    } else if (type === 1) {
      for (var q = 0; q < 5; q++) o += '<ellipse cx="0" cy="-5" rx="3.3" ry="5.4" fill="#ff8fb8" stroke="#d9588a" stroke-width=".6" transform="rotate(' + q * 72 + ')"/>';
      o += '<circle r="2.4" fill="#ffd54a"/>';
    } else if (type === 2) {
      var tc = ['#ef4a5a', '#ff7aa8', '#9a6be8'][Math.floor(R() * 3)];
      o += '<path d="M-5 2 Q-6 -9 -2.5 -13 L0 -8 L2.5 -13 Q6 -9 5 2 Q0 5 -5 2Z" fill="' + tc + '" stroke="rgba(0,0,0,.25)" stroke-width=".7"/>';
    } else if (type === 3) {
      o += '<circle r="4.2" fill="#ffd528" stroke="#d99a12" stroke-width=".7"/><circle r="1.8" fill="#fff3a0"/>';
    } else {
      o += '<path d="M-4 0 Q-5 -8 0 -9 Q5 -8 4 0 Q0 3 -4 0Z" fill="#8a7be8" stroke="rgba(0,0,0,.2)" stroke-width=".6"/><circle cx="-2.4" cy="-4" r="1" fill="#fff" opacity=".6"/>';
    }
    return o + '</g>';
  }
  var fl = [];
  for (i = 0; i < 56; i++) {
    var fx = rr(0, 960), fy = rr(472, 592);
    if (fy > 498 && fx > 380 && fx < 580) continue;
    fl.push([fx, fy, .55 + (fy - 462) / 130 * .75, Math.floor(R() * 5)]);
  }
  fl.sort(function (p, q) { return p[1] - q[1]; });
  $('gFlowers').innerHTML = fl.map(function (p) { return flower(p[0], p[1], p[2], p[3]); }).join('');

  // foreground grass + flowers
  grass('gFront', 120, 606, 640, 38, 78, ['front-1', 'front-2', 'front-3'], 4, 'f');
  var ffl = '';
  [[40, 590], [130, 600], [300, 598], [690, 600], [820, 592], [915, 602]].forEach(function (p) { ffl += flower(p[0], p[1], 1.5, Math.floor(R() * 5)); });
  $('gFront').insertAdjacentHTML('beforeend', ffl);

  // butterflies
  var BF = [['#ff9a3c', '#ffd27a', 300, 430, 140, 50, .55, 0], ['#6fb6ff', '#c7e4ff', 660, 400, 120, 60, .42, 2], ['#ff7ab0', '#ffc3da', 520, 340, 170, 40, .35, 4]];
  s = '';
  BF.forEach(function (b, n) {
    s += '<g id="bf' + n + '"><g class="wings"><ellipse cx="-5" cy="-2" rx="5.5" ry="4.2" fill="' + b[0] + '"/><ellipse cx="5" cy="-2" rx="5.5" ry="4.2" fill="' + b[0] + '"/>' +
      '<ellipse cx="-4" cy="3" rx="3.6" ry="3" fill="' + b[1] + '"/><ellipse cx="4" cy="3" rx="3.6" ry="3" fill="' + b[1] + '"/></g><rect x="-.9" y="-6" width="1.8" height="12" rx=".9" fill="#2a2a2a"/></g>';

    var api = {};

      else if (c === 'bell') { for (i = 0; i < n.length; i++) { var tb = t + i * .09; tone(tb, f * 2 * n[i], f * 2 * n[i], .9, { vol: .4, a: .006, type: 'sine', nolp: 1 }); tone(tb, f * 2 * n[i] * 2.76, f * 2 * n[i] * 2.76, .45, { vol: .12, a: .004, type: 'sine', nolp: 1 }); } }

  var SOUND_ON = true; try { SOUND_ON = localStorage.getItem('devine.sound') !== '0'; } catch (e) {}
  var AC = null, SND = null, sndLast = {}, sndBtn = $('dvSnd');
